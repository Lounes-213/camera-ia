# Deploy to GitHub Pages (free).
#
# 1. Push this repository to GitHub.
# 2. Settings → Pages → Build and deployment → Source: GitHub Actions.
# 3. Push to `main` (or run the workflow manually) and the app is live at
#    https://<user>.github.io/<repo>/ — HTTPS is included, which the camera needs.
#
# Note: GitHub Pages cannot run the Cloudflare/Netlify serverless proxy, so the
# online model search falls back to the bundled offline index when hosted here.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare assets (marker, icons, MediaPipe runtime, decoders)
        run: npm run prepare:assets

      - name: Compile the tracking target
        run: npm run gen:target || echo "Pre-compiled targets.mind used"

      - name: Typecheck, lint and test
        run: |
          npx tsc -b
          npm run lint
          npm test

      - name: Build for a project sub-path
        env:
          # Pages serves project sites from /<repo>/, so assets need that base.
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npx vite build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
